name: Backend Tests

on:
  push:
    paths: ['backend/**', 'frontend/src/lib/**', '.github/workflows/backend-tests.yml']
  pull_request:
    paths: ['backend/**', 'frontend/src/lib/**']

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ischool
          POSTGRES_PASSWORD: ischool
          POSTGRES_DB: ischool_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ischool" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      # Data contoh memakai tanggal relatif terhadap "hari ini": buat ulang agar selaras dengan hari pengujian
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Regenerasi data contoh
        working-directory: frontend
        run: npm ci && npm run export-seed
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://ischool:ischool@localhost:5432/ischool_test
