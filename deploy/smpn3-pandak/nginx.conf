# SMP Negeri 3 Pandak — iSchool (frontend statis + API FastAPI)
# Lalu lintas publik masuk lewat Cloudflare Tunnel ke port 80 server ini.

server {
    listen 80;
    listen [::]:80;
    server_name web.smppandak3-bantul.sch.id;
    root /var/www/smpn3pandak/web;
    index index.html;

    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location / {
        try_files $uri $uri/ $uri.html =404;
    }
    error_page 404 /404.html;
}

server {
    listen 80;
    listen [::]:80;
    server_name api.smppandak3-bantul.sch.id;
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:8110;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
